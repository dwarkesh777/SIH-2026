<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/src/assets/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriSmart AI - Intelligent Agriculture Decision Support System</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-secondary-dark text-dark font-sans antialiased min-h-screen">
    <div id="root"></div>

    <!-- Google Translate Element & Script -->
    <div id="google_translate_element" style="display:none;position:absolute;top:-9999px;left:-9999px;opacity:0;pointer-events:none;"></div>
    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        try {
          if (window.google && window.google.translate && window.google.translate.TranslateElement) {
            new window.google.translate.TranslateElement({
              pageLanguage: 'en',
              includedLanguages: 'en,hi,gu,ta,te,kn,ml,bn,mr',
              autoDisplay: false
            }, 'google_translate_element');
          }
        } catch (e) {
          console.warn('Google Translate initialization error:', e);
        }
      };
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
